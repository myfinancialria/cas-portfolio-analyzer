[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cas-portfolio-analyzer"
version = "0.1.0"
description = "Analyze Indian mutual-fund CAS statements: category bifurcation, latest NAV, gains, XIRR, CAGR, research links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "myfinancialria" }]
keywords = ["mutual-funds", "CAS", "CAMS", "KFintech", "AMFI", "India", "portfolio", "XIRR"]
dependencies = [
    "casparser>=0.7.3",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cas-analyzer = "cas_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/myfinancialria/cas-portfolio-analyzer"
"Web app" = "https://myfinancialria.github.io/cas-portfolio-analyzer/"

[tool.setuptools.packages.find]
include = ["cas_analyzer*"]
